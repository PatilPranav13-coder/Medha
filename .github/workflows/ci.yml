name: Medha launch checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and model test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ruff==0.17.6 pip-audit==2.10.1
      - name: Run complete test suites
        run: |
          python -m unittest discover -s backend -p "test_*.py" -v
          python -m unittest discover -s medha_local_llm/tests -v
          python -m unittest discover -s websearch -p "test_*.py" -v
          python -m unittest discover -s safety -p "test_*.py" -v
          python -m unittest discover -s evals/redteam -p "test_*.py" -v
          python -m unittest discover -s evals/capability -p "test_*.py" -v
      - name: Lint Python sources
        # The separately owned data-factory package is outside the launch scope.
        run: python -m ruff check --select E4,E7,E9,F --extend-exclude backend/medha_data_factory backend medha_local_llm websearch safety evals scripts
      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt
      - name: Scan tracked files for common credential formats
        run: python scripts/secret_scan.py
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build the production image
        run: docker build --tag medha-ci .
