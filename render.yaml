# Free Postgres is suitable for a short-lived demo only: Render expires it
# after 30 days. Upgrade it or switch to a durable external database to keep data.
projects:
  - name: medha
    environments:
      - name: production
        databases:
          - name: medha-db
            databaseName: medha
            plan: free
            region: singapore
            postgresMajorVersion: "16"
        services:
          - type: web
            name: medha-api
            runtime: docker
            dockerfilePath: ./backend/Dockerfile
            dockerContext: .
            region: singapore
            plan: free
            healthCheckPath: /health/ready
            envVars:
              - key: PORT
                value: "8000"
              - key: MEDHA_ENV
                value: production
              - key: MEDHA_AUTH_SECRET
                generateValue: true
              - key: MEDHA_COOKIE_SECURE
                value: "true"
              - key: MEDHA_CORS_ORIGINS
                fromService:
                  type: web
                  name: medha-frontend
                  envVarKey: RENDER_EXTERNAL_URL
              - key: MEDHA_DATABASE_URL
                fromDatabase:
                  name: medha-db
                  property: connectionString
              - key: MEDHA_AI_PROVIDER
                value: openai-compatible
              - key: MEDHA_AI_BASE_URL
                sync: false
              - key: MEDHA_MODEL_NAME
                sync: false
              - key: MEDHA_AI_API_KEY
                sync: false
          - type: web
            name: medha-frontend
            runtime: docker
            dockerfilePath: ./frontend/Dockerfile
            dockerContext: .
            region: singapore
            plan: free
            envVars:
              - key: NEXT_PUBLIC_API_BASE_URL
                fromService:
                  type: web
                  name: medha-api
                  envVarKey: RENDER_EXTERNAL_URL
