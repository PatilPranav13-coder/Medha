<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Medha AI</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#0b1020;color:#e8ecff;font:16px system-ui,sans-serif}
    main{width:min(850px,100%);height:100vh;margin:auto;padding:24px;display:flex;flex-direction:column;gap:18px}
    h1{margin:0;font-size:1.5rem} p{color:#aab5d6;margin:0}.chat{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:10px 0}
    .message{max-width:80%;padding:13px 16px;border-radius:16px;white-space:pre-wrap;line-height:1.45}.user{align-self:end;background:#4f46e5}.bot{align-self:start;background:#18223d}
    form{display:flex;gap:10px} input{flex:1;border:1px solid #33415f;border-radius:12px;background:#121a2f;color:#fff;padding:14px;font:inherit}button{border:0;border-radius:12px;background:#7c6cff;color:#fff;padding:0 20px;font-weight:700;cursor:pointer}
  </style>
</head>
<body><main><header><h1>Medha AI</h1><p>Local model · independently trained weights · no external AI APIs</p></header><section id="chat" class="chat"><div class="message bot">Hello. Train Medha first, then ask me anything.</div></section><form id="form"><input id="message" placeholder="Message Medha" autocomplete="off"><button>Send</button></form></main>
<script>
const chat=document.querySelector('#chat'), form=document.querySelector('#form'), input=document.querySelector('#message');
function add(text, who){const el=document.createElement('div');el.className=`message ${who}`;el.textContent=text;chat.append(el);chat.scrollTop=chat.scrollHeight;return el}
form.addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;add(message,'user');input.value='';const pending=add('Thinking…','bot');try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});const body=await r.json();pending.textContent=body.reply||body.detail||'No response.'}catch{pending.textContent='Cannot reach the local Medha server.'}});
</script></body></html>
